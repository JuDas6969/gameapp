name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Engine tests
        run: |
          cd PuzzleEngine
          swift test 2>&1 | tee ../test.log | tail -40
          cd ..
          { echo "## Engine tests"; echo '```'; grep -E "error:|failed|Executed|passed" test.log | sed 's|/Users/runner/work/[^ ]*/gameapp/||' | sort -u | head -60; echo '```'; } > report.md
        continue-on-error: true

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Raetsel.xcodeproj \
            -scheme Raetsel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          { echo "## Xcode build"; echo '```'; grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sed 's|/Users/runner/work/[^ ]*/gameapp/||' | sort -u | head -80; echo '```'; } >> report.md
          grep -q "BUILD SUCCEEDED" build.log

      - name: Report to commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f report.md ] || echo "no report" > report.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat report.md | head -c 60000)" >/dev/null || true

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Raetsel.app Payload/
          zip -qr Raetsel.ipa Payload
          ls -la Raetsel.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Raetsel-ipa
          path: Raetsel.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
